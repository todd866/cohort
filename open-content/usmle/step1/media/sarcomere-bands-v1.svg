<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-labelledby="title desc">
  <title id="title">Sarcomere bands</title>
  <desc id="desc">Labeled resting sarcomere from Z-line to Z-line showing I band, A band, and H zone.</desc>
  <rect width="640" height="220" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#222">Resting sarcomere (Z -> Z)</text>

  <!-- thin filaments (actin) -->
  <rect x="80" y="88" width="140" height="10" fill="#4a90d9"/>
  <rect x="80" y="118" width="140" height="10" fill="#4a90d9"/>
  <rect x="420" y="88" width="140" height="10" fill="#4a90d9"/>
  <rect x="420" y="118" width="140" height="10" fill="#4a90d9"/>

  <!-- thick filaments (myosin) -->
  <rect x="200" y="95" width="240" height="24" rx="4" fill="#c0392b"/>

  <!-- Z lines -->
  <line x1="80" y1="70" x2="80" y2="150" stroke="#111" stroke-width="4"/>
  <line x1="560" y1="70" x2="560" y2="150" stroke="#111" stroke-width="4"/>
  <text x="80" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#111">Z</text>
  <text x="560" y="168" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#111">Z</text>

  <!-- band braces -->
  <line x1="80" y1="55" x2="200" y2="55" stroke="#4a90d9" stroke-width="2"/>
  <text x="140" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4a90d9">I band</text>
  <line x1="200" y1="55" x2="440" y2="55" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#c0392b">A band</text>
  <line x1="440" y1="55" x2="560" y2="55" stroke="#4a90d9" stroke-width="2"/>
  <text x="500" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4a90d9">I band</text>

  <line x1="280" y1="145" x2="360" y2="145" stroke="#666" stroke-width="2"/>
  <text x="320" y="162" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#666">H zone</text>

  <text x="320" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">During shortening: I band and H zone narrow; A band width stays constant</text>
</svg>

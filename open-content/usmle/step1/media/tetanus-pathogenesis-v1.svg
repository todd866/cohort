<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">Tetanus spore germination and toxin</title>
  <desc id="d">Spore germination in wound; tetanospasmin blocks inhibitory glycine/GABA release causing spasms.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Tetanus spore germination and toxin</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="55" width="200" height="80" rx="6" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Spores in soil</text>
  <text x="140.0" y="107" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">wound germination</text>  <rect x="280" y="55" width="200" height="80" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="380.0" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Tetanospasmin</text>
  <text x="380.0" y="107" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">retrograde to CNS</text>  <rect x="520" y="55" width="160" height="80" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="600.0" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Cleaves SNARE</text>
  <text x="600.0" y="107" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">blocks glycine/GABA</text>  <line x1="240" y1="95" x2="280" y2="95" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <line x1="480" y1="95" x2="520" y2="95" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <rect x="160" y="180" width="400" height="100" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="228" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Result</text>
  <text x="360.0" y="242" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">disinhibit motor neurons -> spasm / lockjaw</text>  <text x="360" y="330" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Vaccine = toxoid; antitoxin for unbound toxin</text>
</svg>

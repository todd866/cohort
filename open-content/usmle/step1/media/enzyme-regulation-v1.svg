<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">Enzyme catalysis and inhibition</title>
  <desc id="d">Enzymes lower activation energy; competitive inhibitors bind active site; allosteric ligands bind elsewhere; glycolysis has key regulated steps.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Enzyme catalysis and inhibition</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="200" height="100" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="108" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Enzyme</text>
  <text x="140.0" y="122" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">lowers Ea</text>  <rect x="280" y="60" width="200" height="100" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="380.0" y="108" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Competitive inhibitor</text>
  <text x="380.0" y="122" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">active-site contest</text>  <rect x="520" y="60" width="160" height="100" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="600.0" y="108" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Allosteric site</text>
  <text x="600.0" y="122" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">other site; shape change</text>  <rect x="160" y="220" width="400" height="100" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="268" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Hexokinase / PFK control points</text>
  <text x="360.0" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">glycolysis key steps regulated</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">Blood components hematopoiesis ABO</title>
  <desc id="d">Hematocrit, buffy coat, albumin, platelets from megakaryocytes, monocyte-macrophage, T-cell thymus, EPO kidney, iron deficiency, ABO donor.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Blood components hematopoiesis ABO</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="200" height="90" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Hematocrit</text>
  <text x="140.0" y="107" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">% RBC volume</text>  <rect x="260" y="50" width="200" height="90" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Buffy coat</text>
  <text x="360.0" y="107" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">WBC + platelets</text>  <rect x="480" y="50" width="200" height="90" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="580.0" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Plasma</text>
  <text x="580.0" y="107" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">albumin most abundant</text>  <rect x="40" y="170" width="160" height="80" rx="6" fill="#fce7f3" stroke="#111" stroke-width="1.5"/>
  <text x="120.0" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Platelets</text>
  <text x="120.0" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">from megakaryocytes</text>  <rect x="220" y="170" width="160" height="80" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="300.0" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Monocyte</text>
  <text x="300.0" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">-> macrophage</text>  <rect x="400" y="170" width="160" height="80" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="480.0" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">T cells</text>
  <text x="480.0" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">thymus mature</text>  <rect x="580" y="170" width="100" height="80" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="630.0" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">EPO</text>
  <text x="630.0" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">kidney</text>  <rect x="40" y="280" width="300" height="80" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Iron deficiency</text>
  <text x="190.0" y="332" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">microcytic anemia</text>  <rect x="380" y="280" width="300" height="80" rx="6" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">ABO</text>
  <text x="530.0" y="332" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">O universal donor; preformed Abs</text>
</svg>

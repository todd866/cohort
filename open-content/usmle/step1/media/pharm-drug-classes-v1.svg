<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="title desc">
<title id="title">High-yield drug class board</title>
<desc id="desc">Aspirin ACE inhibitor statin metformin NSAID heparin warfarin epinephrine amoxicillin prednisone furosemide</desc>
<rect width="960" height="620" fill="#f7f4ef"/>
<text x="36" y="40" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">Drug class map (FOSS draft)</text>
<text x="36" y="68" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">MedlinePlus class labels - not a dosing guide</text>
<rect x="36" y="95" width="290" height="100" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="50" y="128" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Aspirin</text>
<text x="50" y="155" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">salicylate / antiplatelet</text>
<text x="50" y="178" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">clots; Reye risk in kids+viral</text>
<rect x="346" y="95" width="290" height="100" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="360" y="128" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Acetaminophen</text>
<text x="360" y="155" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">analgesic / antipyretic</text>
<text x="360" y="178" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">liver injury at high dose</text>
<rect x="656" y="95" width="290" height="100" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="670" y="128" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Warfarin</text>
<text x="670" y="155" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">vitamin K antagonist</text>
<text x="670" y="178" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">anticoagulant; INR monitor</text>
<rect x="36" y="210" width="290" height="100" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="50" y="243" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Heparin</text>
<text x="50" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">anticoagulant</text>
<text x="50" y="293" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">IV/SQ; rapid onset</text>
<rect x="346" y="210" width="290" height="100" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="360" y="243" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Metformin</text>
<text x="360" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">biguanide</text>
<text x="360" y="293" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">type 2 diabetes; not type 1</text>
<rect x="656" y="210" width="290" height="100" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="670" y="243" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Ibuprofen</text>
<text x="670" y="270" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">NSAID</text>
<text x="670" y="293" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">pain/fever/inflammation</text>
<rect x="36" y="325" width="290" height="100" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="50" y="358" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Lisinopril</text>
<text x="50" y="385" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">ACE inhibitor</text>
<text x="50" y="408" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">HTN / heart failure</text>
<rect x="346" y="325" width="290" height="100" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="360" y="358" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Atorvastatin</text>
<text x="360" y="385" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">HMG-CoA reductase</text>
<text x="360" y="408" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">LDL cholesterol</text>
<rect x="656" y="325" width="290" height="100" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="670" y="358" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Epinephrine</text>
<text x="670" y="385" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">catecholamine</text>
<text x="670" y="408" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">anaphylaxis: airway + vessels</text>
<rect x="36" y="440" width="290" height="100" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="50" y="473" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Amoxicillin</text>
<text x="50" y="500" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">beta-lactam antibiotic</text>
<text x="50" y="523" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">bacterial infections</text>
<rect x="346" y="440" width="290" height="100" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="360" y="473" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Prednisone</text>
<text x="360" y="500" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#333">corticosteroid</text>
<text x="360" y="523" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#666">inflammation / replacement</text>
<rect x="656" y="440" width="290" height="100" rx="10" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="670" y="473" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Furosemide</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">Male reproductive pathway</title>
  <desc id="d">Spermatogenesis to four haploid sperm, epididymal maturation, Leydig testosterone, midpiece mitochondria, seminal vesicle fructose.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Male reproductive pathway</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="140" height="80" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="110.0" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Spermatogenesis</text>
  <text x="110.0" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">4 haploid sperm</text>  <rect x="220" y="60" width="140" height="80" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="290.0" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Epididymis</text>
  <text x="290.0" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">maturation / storage</text>  <rect x="400" y="60" width="140" height="80" rx="6" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/>
  <text x="470.0" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Vas deferens</text>
  <text x="470.0" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">transport</text>  <rect x="560" y="60" width="120" height="80" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="620.0" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Ejaculation</text>
  <text x="620.0" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">mix + exit</text>  <line x1="180" y1="100" x2="220" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <line x1="360" y1="100" x2="400" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <line x1="540" y1="100" x2="560" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <rect x="40" y="180" width="200" height="90" rx="6" fill="#fce7f3" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="223" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Leydig cells</text>
  <text x="140.0" y="237" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">LH -> testosterone</text>  <rect x="280" y="180" width="200" height="90" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="380.0" y="223" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Sperm midpiece</text>
  <text x="380.0" y="237" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">mitochondria for motility</text>  <rect x="520" y="180" width="160" height="90" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="600.0" y="223" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Seminal vesicles</text>
  <text x="600.0" y="237" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">fructose energy</text>  <text x="360" y="320" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Sertoli / FSH support germ cells; testosterone from Leydig drives spermatogenesis</text>
</svg>

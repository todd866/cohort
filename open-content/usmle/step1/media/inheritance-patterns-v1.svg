<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">Autosomal recessive vs mitochondrial inheritance</title>
  <desc id="d">AR carrier risk 1/4; mitochondrial maternal-only transmission.</desc>
  <rect width="720" height="320" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Autosomal recessive vs mitochondrial inheritance</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="300" height="160" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Autosomal recessive</text>
  <text x="190.0" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">both alleles needed</text>  <text x="190" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">carrier x carrier -> 1/4 affected</text>  <text x="190" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">skips generations; equal sexes</text>  <rect x="380" y="60" width="300" height="160" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="138" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Mitochondrial</text>
  <text x="530.0" y="152" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">maternal transmission</text>  <text x="530" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">all children of affected mother</text>  <text x="530" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">father does not pass mtDNA</text>  <text x="360" y="280" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Pedigree shape is the exam discriminator</text>
</svg>

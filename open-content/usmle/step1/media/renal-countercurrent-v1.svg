<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">Countercurrent GFR compartments EPO voiding</title>
  <desc id="d">Loop countercurrent concentrates medulla; inulin clearance equals GFR; fluid compartments; renal EPO; micturition reflex.</desc>
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Countercurrent GFR compartments EPO voiding</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="160" height="70" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="120.0" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Cortex</text>
  <text x="120.0" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">300 mOsm</text>  <rect x="240" y="50" width="200" height="70" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="340.0" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Loop of Henle</text>
  <text x="340.0" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">countercurrent multiplier</text>  <rect x="480" y="50" width="200" height="70" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="580.0" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Medulla</text>
  <text x="580.0" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">up to ~1200</text>  <rect x="40" y="150" width="200" height="80" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Inulin clearance</text>
  <text x="140.0" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">= GFR (filtered only)</text>  <rect x="280" y="150" width="200" height="80" rx="6" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/>
  <text x="380.0" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Fluid compartments</text>
  <text x="380.0" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">ICF 2/3; ECF 1/3</text>  <rect x="520" y="150" width="160" height="80" rx="6" fill="#fce7f3" stroke="#111" stroke-width="1.5"/>
  <text x="600.0" y="188" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">EPO</text>
  <text x="600.0" y="202" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">peritubular kidney</text>  <rect x="160" y="260" width="400" height="80" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="298" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Micturition</text>
  <text x="360.0" y="312" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">stretch -> parasymp void; somatic sphincter</text>
</svg>

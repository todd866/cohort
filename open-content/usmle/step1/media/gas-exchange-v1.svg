<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">Gas exchange CO2 transport chemoreceptors</title>
  <desc id="d">V/Q, PO2 gradient, CO2 as bicarbonate with chloride shift, central chemoreceptors, brainstem rhythm, Dalton and Henry.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Gas exchange CO2 transport chemoreceptors</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="200" height="70" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">V/Q matching</text>
  <text x="140.0" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">air and blood align</text>  <rect x="280" y="50" width="200" height="70" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="380.0" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">PO2 gradient</text>
  <text x="380.0" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">alveolus -> blood</text>  <rect x="520" y="50" width="160" height="70" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="600.0" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">O2 delivery</text>
  <text x="600.0" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">Hb + dissolved</text>  <rect x="40" y="150" width="300" height="100" rx="6" fill="#fce7f3" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">CO2 transport</text>
  <text x="190.0" y="212" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">bicarb ~70%; Hb-carbamino; dissolved</text>  <rect x="380" y="150" width="300" height="100" rx="6" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="198" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Chloride shift</text>
  <text x="530.0" y="212" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">HCO3- out / Cl- into RBC</text>  <rect x="40" y="280" width="200" height="80" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Central chemoreceptors</text>
  <text x="140.0" y="332" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">CSF H+ from CO2</text>  <rect x="270" y="280" width="200" height="80" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="370.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Brainstem rhythm</text>
  <text x="370.0" y="332" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">VRG / DRG / pneumotaxic</text>  <rect x="500" y="280" width="180" height="80" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="590.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Altitude / dive</text>
  <text x="590.0" y="332" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">Dalton / Henry laws</text>
</svg>

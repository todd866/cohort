<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Gastric secretion phases and cells</title>
  <desc id="desc">Cephalic, gastric, intestinal phases; parietal cells make acid and intrinsic factor; chief cells make pepsinogen; G cells make gastrin.</desc>
  <rect width="720" height="300" fill="#fff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111">Stomach - phases and secretory cells</text>
  <rect x="30" y="50" width="210" height="90" rx="6" fill="#eff6ff" stroke="#111"/>
  <text x="135" y="75" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#111">1. Cephalic</text>
  <text x="135" y="95" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">sight/smell/thought</text>
  <text x="135" y="115" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">vagal ACh priming</text>
  <rect x="255" y="50" width="210" height="90" rx="6" fill="#ecfdf5" stroke="#111"/>
  <text x="360" y="75" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#111">2. Gastric</text>
  <text x="360" y="95" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">distension + peptides</text>
  <text x="360" y="115" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">gastrin from G cells</text>
  <rect x="480" y="50" width="210" height="90" rx="6" fill="#fff7ed" stroke="#111"/>
  <text x="585" y="75" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#111">3. Intestinal</text>
  <text x="585" y="95" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">chyme in duodenum</text>
  <text x="585" y="115" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">secretin/CCK brake acid</text>
  <rect x="40" y="170" width="200" height="70" rx="6" fill="#f3f4f6" stroke="#111"/>
  <text x="140" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#111">Parietal</text>
  <text x="140" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">HCl + intrinsic factor</text>
  <rect x="260" y="170" width="200" height="70" rx="6" fill="#f3f4f6" stroke="#111"/>
  <text x="360" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#111">Chief</text>
  <text x="360" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">pepsinogen</text>
  <rect x="480" y="170" width="200" height="70" rx="6" fill="#f3f4f6" stroke="#111"/>
  <text x="580" y="200" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#111">G cell</text>
  <text x="580" y="220" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">gastrin</text>
  <text x="360" y="275" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">IF needed for B12 absorption in terminal ileum</text>
</svg>

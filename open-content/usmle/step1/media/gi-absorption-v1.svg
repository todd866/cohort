<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">GI absorption villi micelles enzymes</title>
  <desc id="d">Villus surface area, Na-glucose cotransport, mucosal barrier, pancreatic enzymes, micelles to chylomicrons, colonic water absorption.</desc>
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">GI absorption villi micelles enzymes</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="200" height="80" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Villi / microvilli</text>
  <text x="140.0" y="102" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">huge surface area</text>  <rect x="280" y="50" width="200" height="80" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="380.0" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">SGLT1</text>
  <text x="380.0" y="102" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">glucose + Na cotransport</text>  <rect x="520" y="50" width="160" height="80" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="600.0" y="88" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Mucosal barrier</text>
  <text x="600.0" y="102" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">mucus + tight jx</text>  <rect x="40" y="160" width="200" height="90" rx="6" fill="#fce7f3" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="203" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Pancreatic enzymes</text>
  <text x="140.0" y="217" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">amylase lipase protease</text>  <rect x="280" y="160" width="200" height="90" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="380.0" y="203" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Micelles</text>
  <text x="380.0" y="217" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">fat to enterocyte</text>  <rect x="520" y="160" width="160" height="90" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="600.0" y="203" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Chylomicrons</text>
  <text x="600.0" y="217" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">lymph then blood</text>  <rect x="40" y="280" width="640" height="70" rx="6" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="313" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Large intestine</text>
  <text x="360.0" y="327" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">water / electrolyte salvage</text>
</svg>

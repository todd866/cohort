<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
<title id="title">Epidemiologic association measures board</title>
<desc id="desc">Risk ratio, odds ratio, and attributable proportion</desc>
<rect width="900" height="420" fill="#f7f4ef"/>
<text x="32" y="40" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">Association measures (CDC SS1978)</text>
<rect x="32" y="70" width="260" height="300" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="52" y="110" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a5f">Risk ratio (RR)</text>
<text x="52" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Also called relative risk</text>
<text x="52" y="185" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Compares risk of an event</text>
<text x="52" y="210" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">in one group vs another</text>
<text x="52" y="250" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Cohort-friendly framing</text>
<rect x="320" y="70" width="260" height="300" rx="12" fill="#fff" stroke="#14532d" stroke-width="2"/>
<text x="340" y="110" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#14532d">Odds ratio (OR)</text>
<text x="340" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Measure of association</text>
<text x="340" y="185" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Two-category exposure</text>
<text x="340" y="210" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">linked to a health outcome</text>
<text x="340" y="250" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Case-control friendly</text>
<rect x="608" y="70" width="260" height="300" rx="12" fill="#fff" stroke="#7c2d12" stroke-width="2"/>
<text x="628" y="110" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#7c2d12">Attributable %</text>
<text x="628" y="150" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Public health impact</text>
<text x="628" y="185" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">of a causative factor</text>
<text x="628" y="220" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Assumes unexposed rate</text>
<text x="628" y="245" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">is background risk</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">Autonomic nervous system divisions</title>
  <desc id="d">Sympathetic thoracolumbar chain fibers vs parasympathetic craniosacral; adrenergic receptor subtypes.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Autonomic nervous system divisions</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="300" height="140" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Sympathetic</text>
  <text x="190.0" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">thoracolumbar T1-L2</text>  <text x="190" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">short pre -> chain / collateral ganglia</text>  <text x="190" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">long post; NE on alpha/beta</text>  <text x="190" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">fight / flight; adrenal medulla exception</text>  <rect x="380" y="50" width="300" height="140" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Parasympathetic</text>
  <text x="530.0" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">craniosacral</text>  <text x="530" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">CN III,VII,IX,X + S2-S4</text>  <text x="530" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">long pre; short post near organ</text>  <text x="530" y="145" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">ACh on muscarinic; rest / digest</text>  <rect x="40" y="220" width="640" height="100" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="268" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Adrenergic receptors (postganglionic sympathetic)</text>
  <text x="360.0" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">a1 vasoconstrict; a2 feedback; b1 heart; b2 bronchodilate / vasodilate</text>
</svg>

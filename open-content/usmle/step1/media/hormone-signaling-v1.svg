<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">Hormone receptor classes and second messengers</title>
  <desc id="d">Membrane vs nuclear receptors, cAMP cascade, steroid transcription, melatonin SCN.</desc>
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Hormone receptor classes and second messengers</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="300" height="120" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="108" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Peptide / catecholamine</text>
  <text x="190.0" y="122" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">membrane receptor</text>  <text x="190" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">cAMP / IP3 / kinase cascades</text>  <text x="190" y="125" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">fast; seconds-minutes</text>  <rect x="380" y="50" width="300" height="120" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="108" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Steroid / thyroid</text>
  <text x="530.0" y="122" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">intracellular receptor</text>  <text x="530" y="100" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">gene transcription</text>  <text x="530" y="125" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">slower; hours</text>  <rect x="40" y="200" width="300" height="90" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="243" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">cAMP example</text>
  <text x="190.0" y="257" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">GPCR -> AC -> PKA</text>  <rect x="380" y="200" width="300" height="90" rx="6" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="243" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Melatonin</text>
  <text x="530.0" y="257" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">SCN / pineal dark signal</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Classical operant and observational learning</title>
  <desc id="d">Classical conditioning associates stimuli; operant links behavior to consequence; observational learning imitates models.</desc>
  <rect width="720" height="300" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Classical operant and observational learning</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="200" height="120" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Classical</text>
  <text x="140.0" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">associate stimuli; UCS reflexive</text>  <rect x="260" y="60" width="200" height="120" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Operant</text>
  <text x="360.0" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">behavior + consequence</text>  <rect x="480" y="60" width="200" height="120" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="580.0" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Observational</text>
  <text x="580.0" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">watch and model</text>  <text x="360" y="240" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">Pleasant consequence -> behavior more likely again</text>
</svg>

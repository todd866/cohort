<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-labelledby="t d">
  <title id="t">Bone remodeling and PTH</title>
  <desc id="d">Osteoblasts build bone; osteoclasts resorb; PTH raises serum Ca2z via bone and kidney; calcitonin opposes.</desc>
  <rect width="640" height="260" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#222">Bone remodeling - cells and PTH</text>
  <rect x="40" y="50" width="170" height="90" rx="8" fill="#d8f3dc" stroke="#2d6a4f"/>
  <text x="125" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#1b4332">Osteoblast</text>
  <text x="125" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#1b4332">builds osteoid / bone</text>
  <rect x="235" y="50" width="170" height="90" rx="8" fill="#ffc2d1" stroke="#c9184a"/>
  <text x="320" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#800f2f">Osteoclast</text>
  <text x="320" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#800f2f">resorbs mineralized bone</text>
  <rect x="430" y="50" width="170" height="90" rx="8" fill="#caf0f8" stroke="#0077b6"/>
  <text x="515" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#023e8a">Osteocyte</text>
  <text x="515" y="108" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#023e8a">mechanosensor in matrix</text>
  <rect x="40" y="160" width="560" height="75" rx="8" fill="#fff" stroke="#ccc"/>
  <text x="55" y="185" font-family="system-ui,sans-serif" font-size="13" fill="#333">PTH (low Ca2z): ' bone resorption (via RANKL on osteoblasts) ? ' renal Ca2z reabsorb ? ' 1,25-(OH)?D</text>
  <text x="55" y="210" font-family="system-ui,sans-serif" font-size="13" fill="#333">Calcitonin (high Ca2z): opposes - " osteoclast activity. Remodeling couples formation " resorption.</text>
</svg>

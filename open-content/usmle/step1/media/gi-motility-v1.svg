<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">Swallowing phases and gut motility</title>
  <desc id="d">Oral pharyngeal esophageal deglutition; segmentation vs peristalsis.</desc>
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Swallowing phases and gut motility</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="180" height="90" rx="6" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/>
  <text x="130.0" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Oral</text>
  <text x="130.0" y="117" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">voluntary chew</text>  <rect x="260" y="60" width="180" height="90" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="350.0" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Pharyngeal</text>
  <text x="350.0" y="117" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">reflex airway protect</text>  <rect x="480" y="60" width="180" height="90" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="570.0" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Esophageal</text>
  <text x="570.0" y="117" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">peristalsis to stomach</text>  <line x1="220" y1="105" x2="260" y2="105" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <line x1="440" y1="105" x2="480" y2="105" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <rect x="40" y="200" width="300" height="100" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="248" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Segmentation</text>
  <text x="190.0" y="262" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">mix; circular local</text>  <rect x="380" y="200" width="300" height="100" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="248" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Peristalsis</text>
  <text x="530.0" y="262" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">propel; coordinated wave</text>  <text x="360" y="350" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Deglutition = oral + pharyngeal + esophageal phases</text>
</svg>

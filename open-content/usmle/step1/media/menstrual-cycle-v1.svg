<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">Menstrual cycle and endometrium</title>
  <desc id="d">Follicular estrogen, LH surge ovulation, luteal progesterone, secretory endometrium, corpus luteum rescue, menopause follicle depletion, oxytocin milk ejection.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Menstrual cycle and endometrium</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="120" height="70" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="100.0" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Follicular</text>
  <text x="100.0" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">estrogen up</text>  <rect x="200" y="50" width="120" height="70" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="260.0" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Ovulation</text>
  <text x="260.0" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">LH surge</text>  <rect x="360" y="50" width="120" height="70" rx="6" fill="#fce7f3" stroke="#111" stroke-width="1.5"/>
  <text x="420.0" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Luteal</text>
  <text x="420.0" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">progesterone</text>  <rect x="520" y="50" width="120" height="70" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="580.0" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Menses</text>
  <text x="580.0" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">P fall</text>  <line x1="160" y1="85" x2="200" y2="85" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <line x1="320" y1="85" x2="360" y2="85" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <line x1="480" y1="85" x2="520" y2="85" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <rect x="40" y="160" width="200" height="90" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="203" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Proliferative endometrium</text>
  <text x="140.0" y="217" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">estrogen rebuilds lining</text>  <rect x="280" y="160" width="200" height="90" rx="6" fill="#fce7f3" stroke="#111" stroke-width="1.5"/>
  <text x="380.0" y="203" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Secretory endometrium</text>
  <text x="380.0" y="217" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">P prepares for implant</text>  <rect x="520" y="160" width="160" height="90" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="600.0" y="203" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Corpus luteum</text>
  <text x="600.0" y="217" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">hCG saves if pregnant</text>  <rect x="40" y="280" width="200" height="80" rx="6" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Menopause</text>
  <text x="140.0" y="332" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">follicle depletion; FSH up</text>  <rect x="280" y="280" width="200" height="80" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="380.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Oxytocin</text>
  <text x="380.0" y="332" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">milk ejection reflex</text>  <rect x="520" y="280" width="160" height="80" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="600.0" y="318" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Positive feedback</text>
  <text x="600.0" y="332" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">E high -> LH surge</text>
</svg>

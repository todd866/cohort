<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">Bone structure and synovial joints</title>
  <desc id="d">Compact vs spongy bone, epiphyseal plate growth, synovial joint structure and types.</desc>
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Bone structure and synovial joints</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="200" height="90" rx="6" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Compact bone</text>
  <text x="140.0" y="107" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">osteons / strength</text>  <rect x="260" y="50" width="200" height="90" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Spongy bone</text>
  <text x="360.0" y="107" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">trabeculae / marrow</text>  <rect x="480" y="50" width="200" height="90" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="580.0" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Epiphyseal plate</text>
  <text x="580.0" y="107" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">length growth</text>  <rect x="40" y="180" width="320" height="120" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="200.0" y="238" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Synovial joint</text>
  <text x="200.0" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">capsule + synovium + fluid</text>  <rect x="400" y="180" width="280" height="120" rx="6" fill="#fce7f3" stroke="#111" stroke-width="1.5"/>
  <text x="540.0" y="238" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Joint types</text>
  <text x="540.0" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">hinge / ball-socket / pivot...</text>
</svg>

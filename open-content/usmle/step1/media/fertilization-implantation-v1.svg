<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">Fertilization and implantation</title>
  <desc id="d">Meiosis-arrested oocyte fertilized in tube ampulla; cortical reaction blocks polyspermy; blastocyst implants; umbilical vessel flow polarity.</desc>
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Fertilization and implantation</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="55" width="150" height="75" rx="6" fill="#fce7f3" stroke="#111" stroke-width="1.5"/>
  <text x="115.0" y="90" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Oocyte</text>
  <text x="115.0" y="104" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">meiosis arrested M2</text>  <rect x="230" y="55" width="150" height="75" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="305.0" y="90" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Ampulla of tube</text>
  <text x="305.0" y="104" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">fertilization site</text>  <rect x="420" y="55" width="150" height="75" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="495.0" y="90" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Cortical reaction</text>
  <text x="495.0" y="104" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">blocks polyspermy</text>  <rect x="40" y="170" width="180" height="80" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="130.0" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Zygote -> blastocyst</text>
  <text x="130.0" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">cleavage in tube</text>  <rect x="260" y="170" width="180" height="80" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="350.0" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Implantation</text>
  <text x="350.0" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">uterine endometrium</text>  <rect x="480" y="170" width="180" height="80" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="570.0" y="208" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Umbilical vessels</text>
  <text x="570.0" y="222" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">2 art O2-low / 1 vein O2-high</text>  <line x1="190" y1="90" x2="230" y2="90" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <line x1="380" y1="90" x2="420" y2="90" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <line x1="220" y1="210" x2="260" y2="210" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <line x1="440" y1="210" x2="480" y2="210" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <text x="360" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Sperm meets egg in fallopian tube ampulla; cortical granules harden zona</text>
</svg>

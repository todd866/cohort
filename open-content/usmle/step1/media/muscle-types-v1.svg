<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">Muscle tissue fiber types and recruitment</title>
  <desc id="d">Skeletal cardiac smooth comparison; type I vs II fibers; ATP sources; motor unit size principle.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Muscle tissue fiber types and recruitment</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="200" height="110" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Skeletal</text>
  <text x="140.0" y="117" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">striated; voluntary; multinucleate</text>  <rect x="260" y="50" width="200" height="110" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Cardiac</text>
  <text x="360.0" y="117" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">striated; involuntary; intercalated</text>  <rect x="480" y="50" width="200" height="110" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="580.0" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Smooth</text>
  <text x="580.0" y="117" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">no striations; hollow organs</text>  <rect x="40" y="190" width="200" height="90" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="233" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Type I fiber</text>
  <text x="140.0" y="247" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">slow oxidative; fatigue resist</text>  <rect x="260" y="190" width="200" height="90" rx="6" fill="#fce7f3" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="233" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Type II fiber</text>
  <text x="360.0" y="247" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">fast; glycolytic power</text>  <rect x="480" y="190" width="200" height="90" rx="6" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/>
  <text x="580.0" y="233" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">ATP sources</text>
  <text x="580.0" y="247" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">CP -> glycolytic -> oxphos</text>  <rect x="160" y="310" width="400" height="60" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="338" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Motor unit recruitment</text>
  <text x="360.0" y="352" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">small slow first; size principle</text>
</svg>

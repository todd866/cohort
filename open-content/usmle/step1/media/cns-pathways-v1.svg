<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">UMN LMN reflex and ascending pathways</title>
  <desc id="d">Upper vs lower motor neuron, stretch reflex arc, ascending sensory tracts, blood-brain barrier.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">UMN LMN reflex and ascending pathways</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="55" width="200" height="90" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">UMN</text>
  <text x="140.0" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">cortex / brainstem</text>  <rect x="280" y="55" width="200" height="90" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="380.0" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">LMN</text>
  <text x="380.0" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">anterior horn / CN</text>  <rect x="520" y="55" width="160" height="90" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="600.0" y="98" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Muscle</text>
  <text x="600.0" y="112" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">contraction</text>  <line x1="240" y1="100" x2="280" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <line x1="480" y1="100" x2="520" y2="100" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <rect x="40" y="180" width="300" height="90" rx="6" fill="#fce7f3" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="223" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Stretch reflex</text>
  <text x="190.0" y="237" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">Ia -> LMN; reciprocal inhibit</text>  <rect x="380" y="180" width="300" height="90" rx="6" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="223" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Ascending tracts</text>
  <text x="530.0" y="237" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">dorsal column / spinothalamic</text>  <rect x="40" y="300" width="640" height="70" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="333" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">BBB</text>
  <text x="360.0" y="347" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">tight junctions; selective CNS barrier</text>
</svg>

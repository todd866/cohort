<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">Passive immunity and maternal IgG</title>
  <desc id="d">Maternal IgG placental transfer; passive antibody time course vs active immunity.</desc>
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Passive immunity and maternal IgG</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="300" height="120" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Maternal IgG</text>
  <text x="190.0" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">crosses placenta FcRn</text>  <text x="190" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">protects neonate months</text>  <rect x="380" y="60" width="300" height="120" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Passive immunity</text>
  <text x="530.0" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">give Abs; immediate</text>  <text x="530" y="120" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">no memory; fades weeks</text>  <rect x="160" y="220" width="400" height="90" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="263" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">vs Active</text>
  <text x="360.0" y="277" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">antigen -> own Abs + memory; slower onset</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Innate vs adaptive immunity board</title>
<desc id="desc">Barriers innate cells complement vs B and T adaptive arms plus hypersensitivity IgE timing</desc>
<rect width="900" height="520" fill="#f7f4ef"/>
<text x="36" y="40" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">Defense layers</text>
<rect x="36" y="70" width="400" height="200" rx="12" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>
<text x="56" y="105" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">Innate (natural)</text>
<text x="56" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Barriers, phagocytes, NK cells</text>
<text x="56" y="168" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Complement (extracellular pathogens)</text>
<text x="56" y="196" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Fast, non-specific</text>
<text x="56" y="230" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">No lasting antigen memory alone</text>
<rect x="464" y="70" width="400" height="200" rx="12" fill="#dcfce7" stroke="#14532d" stroke-width="2"/>
<text x="484" y="105" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Adaptive</text>
<text x="484" y="140" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">B cells -&gt; antibodies (humoral)</text>
<text x="484" y="168" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">T cells -&gt; cell-mediated</text>
<text x="484" y="196" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Antigen-specific; memory</text>
<text x="484" y="230" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Boosters expand memory B/T</text>
<rect x="36" y="300" width="400" height="180" rx="12" fill="#fff" stroke="#7c2d12" stroke-width="2"/>
<text x="56" y="340" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#7c2d12">Hypersensitivity (IgE)</text>
<text x="56" y="375" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Minutes after re-exposure</text>
<text x="56" y="405" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Mast cell degranulation</text>
<text x="56" y="435" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Anaphylaxis -&gt; epinephrine</text>
<rect x="464" y="300" width="400" height="180" rx="12" fill="#fff" stroke="#7f1d1d" stroke-width="2"/>
<text x="484" y="340" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#7f1d1d">Autoimmunity</text>
<text x="484" y="375" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Adaptive attack on self</text>
<text x="484" y="405" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Failure of self-tolerance</text>
<text x="484" y="435" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a">Tissue-specific damage</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d">
  <title id="t">Proto-oncogenes p53 and homologs</title>
  <desc id="d">Proto-oncogenes encode positive cell-cycle regulators; p53 triggers repair after damage; homologous chromosomes match gene loci.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Proto-oncogenes p53 and homologs</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="60" width="300" height="120" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Proto-oncogenes</text>
  <text x="190.0" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">positive cell-cycle regulators</text>  <rect x="380" y="60" width="300" height="120" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">p53</text>
  <text x="530.0" y="132" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">damage -> repair mechanisms</text>  <rect x="160" y="220" width="400" height="100" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="268" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Homologous chromosomes</text>
  <text x="360.0" y="282" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">same genes, matched loci</text>
</svg>

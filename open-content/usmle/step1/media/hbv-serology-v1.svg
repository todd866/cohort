<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">Hepatitis B serology patterns</title>
  <desc id="d">HBsAg anti-HBs anti-HBc HBeAg patterns for acute chronic recovery and vaccinated states.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Hepatitis B serology patterns</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="50" width="640" height="300" fill="#fafafa" stroke="#111"/>  <text x="50" y="75" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Marker</text>  <text x="175" y="75" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Acute</text>  <text x="300" y="75" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Chronic infect</text>  <text x="425" y="75" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Recovery</text>  <text x="550" y="75" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Vaccinated</text>  <text x="50" y="110" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">HBsAg</text>  <text x="175" y="110" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">+</text>  <text x="300" y="110" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">+</text>  <text x="425" y="110" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">-</text>  <text x="550" y="110" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">-</text>  <text x="50" y="160" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">anti-HBs</text>  <text x="175" y="160" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">-</text>  <text x="300" y="160" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">-</text>  <text x="425" y="160" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">+</text>  <text x="550" y="160" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">+</text>  <text x="50" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">anti-HBc</text>  <text x="175" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">IgM/+</text>  <text x="300" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">+</text>  <text x="425" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">+</text>  <text x="550" y="210" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">-</text>  <text x="50" y="260" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">HBeAg</text>  <text x="175" y="260" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">+/-</text>  <text x="300" y="260" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">infectivity</text>  <text x="425" y="260" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">-</text>  <text x="550" y="260" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#333">-</text>  <text x="360" y="370" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">HBsAg = infection; anti-HBs alone = vaccine; anti-HBc = prior exposure</text>
</svg>

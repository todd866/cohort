<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-labelledby="t d">
  <title id="t">Insulin and glucagon opposing actions</title>
  <desc id="desc">Fed state insulin promotes storage; fasting glucagon promotes mobilization of glucose and ketones.</desc>
  <rect width="720" height="280" fill="#fff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#111">Insulin vs glucagon</text>
  <rect x="40" y="50" width="300" height="180" rx="8" fill="#ecfdf5" stroke="#111"/>
  <text x="190" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#065f46">INSULIN (fed)</text>
  <text x="190" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111">from beta cells</text>
  <text x="190" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111">glucose uptake / glycolysis</text>
  <text x="190" y="165" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111">glycogen + fat + protein store</text>
  <text x="190" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111">inhibits ketogenesis</text>
  <rect x="380" y="50" width="300" height="180" rx="8" fill="#fff7ed" stroke="#111"/>
  <text x="530" y="80" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#9a3412">GLUCAGON (fast)</text>
  <text x="530" y="110" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111">from alpha cells</text>
  <text x="530" y="140" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111">glycogenolysis / gluconeogenesis</text>
  <text x="530" y="165" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111">lipolysis - FFAs to liver</text>
  <text x="530" y="190" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#111">permits ketogenesis</text>
  <text x="360" y="260" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#555">Type 1 DM: beta-cell loss - absolute insulin deficiency</text>
</svg>

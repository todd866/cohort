<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t d">
  <title id="t">Nephron overview</title>
  <desc id="d">Labeled nephron: glomerulus/Bowman capsule, PCT, loop of Henle, DCT, collecting duct with key transport sites.</desc>
  <rect width="640" height="300" fill="#fafafa"/>
  <text x="320" y="26" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" fill="#222">Nephron - key segments</text>
  <!-- glomerulus -->
  <circle cx="120" cy="90" r="28" fill="#f4a261" stroke="#e76f51" stroke-width="2"/>
  <ellipse cx="120" cy="90" rx="40" ry="32" fill="none" stroke="#264653" stroke-width="2"/>
  <text x="120" y="55" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#264653">Bowman + glomerulus</text>
  <!-- PCT -->
  <path d="M160,90 C200,60 240,60 260,90 C240,120 200,120 160,90" fill="none" stroke="#2a9d8f" stroke-width="8"/>
  <text x="210" y="45" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#2a9d8f">PCT (bulk reabsorb)</text>
  <!-- descending -->
  <path d="M260,90 L280,200" fill="none" stroke="#457b9d" stroke-width="6"/>
  <text x="300" y="160" font-family="system-ui,sans-serif" font-size="11" fill="#457b9d">thin desc. (H?O out)</text>
  <!-- ascending -->
  <path d="M280,200 L300,90" fill="none" stroke="#1d3557" stroke-width="6"/>
  <text x="320" y="200" font-family="system-ui,sans-serif" font-size="11" fill="#1d3557">thick asc. (NaCl out)</text>
  <!-- DCT -->
  <path d="M300,90 C340,50 400,50 430,90" fill="none" stroke="#e9c46a" stroke-width="7"/>
  <text x="370" y="45" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#bc6c25">DCT (aldosterone site)</text>
  <!-- CD -->
  <path d="M430,90 L450,240" fill="none" stroke="#6d597a" stroke-width="10"/>
  <text x="480" y="180" font-family="system-ui,sans-serif" font-size="11" fill="#6d597a">Collecting duct</text>
  <text x="480" y="198" font-family="system-ui,sans-serif" font-size="11" fill="#6d597a">ADH -> aquaporins</text>
  <!-- notes -->
  <rect x="40" y="230" width="560" height="55" rx="6" fill="#fff" stroke="#ddd"/>
  <text x="55" y="252" font-family="system-ui,sans-serif" font-size="12" fill="#333">Filtration barrier (charge + size) at glomerulus ? TGF via macula densa ? RAAS when NaCl delivery falls</text>
  <text x="55" y="272" font-family="system-ui,sans-serif" font-size="12" fill="#333">PCT: isosmotic reabsorb ? Loop: concentrate medulla ? CD: fine-tune H?O/Na under hormones</text>
</svg>

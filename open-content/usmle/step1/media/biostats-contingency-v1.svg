<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
<title id="title">Diagnostic 2x2 contingency board</title>
<desc id="desc">Disease rows vs test columns with TP FP FN TN and formulas for sensitivity specificity and PPV</desc>
<rect width="920" height="560" fill="#f7f4ef"/>
<text x="40" y="42" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1a1a1a">Diagnostic test 2x2</text>
<text x="40" y="72" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#555">Disease present vs absent; test positive vs negative</text>
<!-- headers -->
<rect x="220" y="110" width="280" height="48" fill="#dbeafe" stroke="#1e3a5f" stroke-width="2"/>
<text x="360" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Test +</text>
<rect x="500" y="110" width="280" height="48" fill="#e5e7eb" stroke="#1e3a5f" stroke-width="2"/>
<text x="640" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a5f">Test -</text>
<rect x="40" y="158" width="180" height="120" fill="#dcfce7" stroke="#1e3a5f" stroke-width="2"/>
<text x="130" y="228" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#14532d">Disease +</text>
<rect x="40" y="278" width="180" height="120" fill="#fee2e2" stroke="#1e3a5f" stroke-width="2"/>
<text x="130" y="348" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#7f1d1d">Disease -</text>
<!-- cells -->
<rect x="220" y="158" width="280" height="120" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="360" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#166534">TP</text>
<text x="360" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">true positive</text>
<rect x="500" y="158" width="280" height="120" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="640" y="210" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#b45309">FN</text>
<text x="640" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">false negative</text>
<rect x="220" y="278" width="280" height="120" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="360" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#b45309">FP</text>
<text x="360" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">false positive</text>
<rect x="500" y="278" width="280" height="120" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="640" y="330" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#166534">TN</text>
<text x="640" y="365" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#555">true negative</text>
<!-- formulas -->
<rect x="40" y="430" width="840" height="100" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="60" y="465" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a">Sensitivity = TP / (TP + FN)   |   among disease+</text>
<text x="60" y="492" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a">Specificity = TN / (TN + FP)   |   among disease-</text>
<text x="60" y="519" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1a1a1a">PPV = TP / (TP + FP)           |   among test+</text>
</svg>

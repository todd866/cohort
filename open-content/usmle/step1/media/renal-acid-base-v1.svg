<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">Renal bicarbonate and K-H interplay</title>
  <desc id="d">Bicarbonate conservation, acidosis compensation, potassium-hydrogen competition.</desc>
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Renal bicarbonate and K-H interplay</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="55" width="300" height="100" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">HCO3 conservation</text>
  <text x="190.0" y="117" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">PCT reclaim filtered bicarb</text>  <rect x="380" y="55" width="300" height="100" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="103" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">New HCO3</text>
  <text x="530.0" y="117" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">glutamine NH4+ / titratable acid</text>  <rect x="40" y="190" width="300" height="100" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="238" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Acidosis compensation</text>
  <text x="190.0" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">kidney increase H+ secretion</text>  <rect x="380" y="190" width="300" height="100" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="238" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">K+ / H+ competition</text>
  <text x="530.0" y="252" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">aldo / acidosis swap both</text>  <text x="360" y="340" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Acidosis -> hyperkalemia risk; alkalosis -> hypokalemia risk (cellular shift)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">Nephrotic syndrome cascade</title>
  <desc id="d">Barrier injury causes proteinuria, hypoalbuminemia, edema, and hyperlipidemia.</desc>
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Nephrotic syndrome cascade</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="200" y="50" width="320" height="70" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="360.0" y="83" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Podocyte / GBM injury</text>
  <text x="360.0" y="97" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">protein leak</text>  <rect x="40" y="160" width="180" height="90" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="130.0" y="203" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Hypoalbuminemia</text>
  <text x="130.0" y="217" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">oncotic P down</text>  <rect x="260" y="160" width="180" height="90" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="350.0" y="203" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Edema</text>
  <text x="350.0" y="217" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">fluid to interstitium</text>  <rect x="480" y="160" width="180" height="90" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="570.0" y="203" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Hyperlipidemia</text>
  <text x="570.0" y="217" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">liver upreg lipids</text>  <line x1="360" y1="120" x2="130" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <line x1="360" y1="120" x2="350" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <line x1="360" y1="120" x2="570" y2="160" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <text x="360" y="300" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#333">Nephrotic labs: heavy proteinuria, low albumin, high lipids, edema</text>
</svg>

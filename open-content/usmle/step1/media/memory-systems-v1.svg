<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">Memory encoding STM hippocampus amygdala</title>
  <desc id="d">Encoding into memory, short-term storage, hippocampus declarative memory, amygdala fear memories, mnemonics and rehearsal.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Memory encoding STM hippocampus amygdala</text>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect x="40" y="55" width="200" height="80" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="140.0" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Encoding</text>
  <text x="140.0" y="107" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">input into memory</text>  <rect x="280" y="55" width="200" height="80" rx="6" fill="#fef3c7" stroke="#111" stroke-width="1.5"/>
  <text x="380.0" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">STM</text>
  <text x="380.0" y="107" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">temporary processing</text>  <rect x="520" y="55" width="160" height="80" rx="6" fill="#d1fae5" stroke="#111" stroke-width="1.5"/>
  <text x="600.0" y="93" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Storage / retrieval</text>
  <text x="600.0" y="107" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">retain and get back</text>  <line x1="240" y1="95" x2="280" y2="95" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <line x1="480" y1="95" x2="520" y2="95" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arr)"/>  <rect x="40" y="170" width="300" height="90" rx="6" fill="#fce7f3" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="213" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Hippocampus</text>
  <text x="190.0" y="227" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">declarative / episodic / recognition</text>  <rect x="380" y="170" width="300" height="90" rx="6" fill="#fee2e2" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="213" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Amygdala</text>
  <text x="530.0" y="227" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">fear and fear memories</text>  <rect x="40" y="290" width="300" height="70" rx="6" fill="#e5e7eb" stroke="#111" stroke-width="1.5"/>
  <text x="190.0" y="323" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Mnemonics</text>
  <text x="190.0" y="337" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">organize for encoding</text>  <rect x="380" y="290" width="300" height="70" rx="6" fill="#dbeafe" stroke="#111" stroke-width="1.5"/>
  <text x="530.0" y="323" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#111">Rehearsal</text>
  <text x="530.0" y="337" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#333">conscious repetition</text>

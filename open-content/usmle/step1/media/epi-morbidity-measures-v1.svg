<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
<title id="title">Incidence vs prevalence board</title>
<desc id="desc">Incidence as new cases over time; prevalence as who have the condition at a time</desc>
<rect width="880" height="360" fill="#f7f4ef"/>
<text x="32" y="40" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1a1a1a">Incidence vs prevalence</text>
<rect x="32" y="70" width="390" height="240" rx="12" fill="#fff" stroke="#1e3a5f" stroke-width="2"/>
<text x="52" y="115" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1e3a5f">Incidence</text>
<text x="52" y="155" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">New cases in a population</text>
<text x="52" y="185" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">over a specified time period</text>
<text x="52" y="225" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Flow / rate framing</text>
<rect x="458" y="70" width="390" height="240" rx="12" fill="#fff" stroke="#14532d" stroke-width="2"/>
<text x="478" y="115" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#14532d">Prevalence</text>
<text x="478" y="155" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Persons who have a condition</text>
<text x="478" y="185" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">at or during a time period</text>
<text x="478" y="225" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#333">Stock / burden framing</text>
</svg>

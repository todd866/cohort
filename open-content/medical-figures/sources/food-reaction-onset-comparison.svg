<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="645" viewBox="0 0 1060 645"><rect width="1060" height="645" fill="#fffaf0"/><g font-family="Arial, sans-serif"><text x="48" y="66" font-size="40" font-weight="700" fill="#183847">When does the reaction begin?</text><text x="48" y="110" font-size="26" font-weight="400" fill="#51636b">Time after eating the trigger food</text><line x1="120" y1="185" x2="120" y2="525" stroke="#d7dfdc" stroke-width="2"/><text x="112" y="563" font-size="25" font-weight="400" fill="#183847">0</text><line x1="330" y1="185" x2="330" y2="525" stroke="#d7dfdc" stroke-width="2"/><text x="322" y="563" font-size="25" font-weight="400" fill="#183847">1</text><line x1="540" y1="185" x2="540" y2="525" stroke="#d7dfdc" stroke-width="2"/><text x="532" y="563" font-size="25" font-weight="400" fill="#183847">2</text><line x1="750" y1="185" x2="750" y2="525" stroke="#d7dfdc" stroke-width="2"/><text x="742" y="563" font-size="25" font-weight="400" fill="#183847">3</text><line x1="960" y1="185" x2="960" y2="525" stroke="#d7dfdc" stroke-width="2"/><text x="952" y="563" font-size="25" font-weight="400" fill="#183847">4</text><text x="407" y="608" font-size="28" font-weight="500" fill="#183847">Hours after eating</text><text x="48" y="163" font-size="28" font-weight="700" fill="#183847">IgE reaction onset</text><path d="M120 207 V238 H330 V207" fill="none" stroke="#cc7255" stroke-width="6"/><text x="365" y="237" font-size="30" font-weight="600" fill="#183847">Usually within 1 hour</text><text x="120" y="291" font-size="27" font-weight="400" fill="#183847">Hives, swelling or breathing symptoms</text><text x="48" y="367" font-size="28" font-weight="700" fill="#183847">Acute FPIES onset</text><path d="M540 411 V442 H960 V411" fill="none" stroke="#288b85" stroke-width="6"/><text x="120" y="440" font-size="30" font-weight="600" fill="#183847">Typically 2–4 hours</text><text x="120" y="499" font-size="27" font-weight="400" fill="#183847">Repeated vomiting; pallor or lethargy may occur</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 8 8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#102a43"/></marker><marker id="teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 8 8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#138a8a"/></marker></defs><rect width="1000" height="750" fill="#fbf6e9"/><text x="500" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">Large VSD: falling PVR unmasks pulmonary overcirculation</text><rect x="55" y="100" width="890" height="82" rx="18" fill="#e9f2ef" stroke="#102a43" stroke-width="2"/><text x="500" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#102a43">After birth: pulmonary vascular resistance falls</text><text x="500" y="168" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#102a43">a large VSD can permit substantial left-to-right flow</text><rect x="70" y="280" width="190" height="130" rx="18" fill="#d9edf5" stroke="#2878b5" stroke-width="3"/><text x="165" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#102a43">LEFT VENTRICLE</text><text x="165" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#102a43">volume load</text><rect x="400" y="240" width="200" height="105" rx="18" fill="#fffdf7" stroke="#d85b50" stroke-width="3"/><text x="500" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#d85b50">LARGE VSD</text><text x="500" y="315" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#102a43">septal opening</text><rect x="740" y="280" width="190" height="130" rx="18" fill="#f9dddd" stroke="#d85b50" stroke-width="3"/><text x="835" y="320" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#102a43">RIGHT VENTRICLE</text><text x="835" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" font-weight="400" fill="#102a43">receives shunt</text><rect x="330" y="510" width="340" height="95" rx="18" fill="#fffdf7" stroke="#138a8a" stroke-width="3"/><text x="500" y="548" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#138a8a">PULMONARY CIRCULATION</text><text x="500" y="580" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#d85b50">overcirculation</text><line x1="260" y1="345" x2="400" y2="292" stroke="#d85b50" stroke-width="6" stroke-linecap="round" marker-end="url(#teal)"/><line x1="600" y1="292" x2="740" y2="345" stroke="#d85b50" stroke-width="6" stroke-linecap="round" marker-end="url(#teal)"/><path d="M835 410 C835 465 700 510 670 540" fill="none" stroke="#138a8a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M330 540 C300 510 165 465 165 410" fill="none" stroke="#2878b5" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="335" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#d85b50">left → right</text><text x="860" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#138a8a">pulmonary flow</text><text x="165" y="508" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#2878b5">pulmonary return</text><rect x="300" y="650" width="400" height="55" rx="18" fill="#fff0e7" stroke="#d85b50" stroke-width="3"/><text x="500" y="684" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#d85b50">Volume load may cause heart failure</text></svg>
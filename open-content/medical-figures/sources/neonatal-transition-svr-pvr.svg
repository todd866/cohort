<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="750" viewBox="0 0 1000 750"><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 8 8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#102a43"/></marker><marker id="teal" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" viewBox="0 0 8 8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#138a8a"/></marker></defs><rect width="1000" height="750" fill="#fbf6e9"/><text x="500" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#102a43">Neonatal transition: two resistance changes</text><rect x="55" y="100" width="400" height="300" rx="18" fill="#e9f2ef" stroke="#102a43" stroke-width="2"/><rect x="545" y="100" width="400" height="300" rx="18" fill="#e9f2ef" stroke="#102a43" stroke-width="2"/><text x="255" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#102a43">Cord clamping</text><text x="745" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#102a43">First breaths</text><rect x="115" y="180" width="280" height="78" rx="18" fill="#fffdf7" stroke="#d8952f" stroke-width="4"/><rect x="605" y="180" width="280" height="78" rx="18" fill="#fffdf7" stroke="#2878b5" stroke-width="4"/><text x="255" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#102a43">low-resistance placenta</text><text x="745" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#102a43">lung aeration + oxygen</text><line x1="255" y1="263" x2="255" y2="300" stroke="#d8952f" stroke-width="5" stroke-linecap="round" marker-end="url(#teal)"/><line x1="745" y1="263" x2="745" y2="300" stroke="#2878b5" stroke-width="5" stroke-linecap="round" marker-end="url(#teal)"/><text x="255" y="350" text-anchor="middle" font-family="Arial,